---
name: Build ISO
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the image to build ISO from'
        required: true
        default: 'latest'

permissions:
  contents: read

jobs:
  build-iso:
    name: Build ISO
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@v7

      - name: Load image name
        id: image-info
        run: |
          source image-template.env
          # Lowercase the image repository name
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
          echo "REPO_ORGANIZATION=${REPO_ORGANIZATION,,}" >> $GITHUB_ENV

      - name: Create empty config
        run: echo "{}" > config.json

      - name: Build ISO
        id: build-iso
        uses: osbuild/bootc-image-builder-action@main
        with:
          config-file: ${{ github.workspace }}/config.json
          image: ghcr.io/${{ env.REPO_ORGANIZATION }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.tag }}
          rootfs: btrfs
          types: |
            iso

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-iso
          path: ${{ steps.build-iso.outputs.output-directory }}
